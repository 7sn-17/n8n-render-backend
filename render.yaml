services:
  - type: web
    name: n8n-backend
    runtime: docker
    plan: free
    region: frankfurt # اختر أقرب منطقة لك
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        fromService:
          name: n8n-backend
          type: web
          property: host
      - key: WEBHOOK_URL
        fromService:
          name: n8n-backend
          type: web
          property: hostport
      - key: N8N_EDITOR_BASE_URL
        fromService:
          name: n8n-backend
          type: web
          property: hostport
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        generateValue: true
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - key: N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES
        value: "false"
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false # سنضيفها يدويًا في Render
      - key: DB_POSTGRESDB_PORT
        value: "6543" # Transaction Pooler
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        sync: false # سنضيفها يدويًا
      - key: DB_POSTGRESDB_PASSWORD
        sync: false # سنضيفها يدويًا
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "none"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: "all"
      - key: GENERIC_TIMEZONE
        value: Asia/Riyadh
      - key: TZ
        value: Asia/Riyadh